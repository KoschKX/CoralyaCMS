<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<!-- Editor frame -->
	<rect x="2" y="3" width="20" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
	<!-- Gutter separator -->
	<line x1="7.5" y1="3" x2="7.5" y2="21" stroke="currentColor" stroke-width="1"/>
	<!-- Line number indicators (gutter) -->
	<rect x="4.5" y="8.5"  width="2" height="1.5" rx="0.75" fill="currentColor"/>
	<rect x="4.5" y="11.5" width="2" height="1.5" rx="0.75" fill="currentColor"/>
	<rect x="4.5" y="14.5" width="2" height="1.5" rx="0.75" fill="currentColor"/>
	<!-- Code lines (varied widths = realistic code) -->
	<rect x="9.5" y="8.5"  width="9"   height="1.5" rx="0.75" fill="currentColor"/>
	<rect x="9.5" y="11.5" width="5.5" height="1.5" rx="0.75" fill="currentColor"/>
	<rect x="9.5" y="14.5" width="10"  height="1.5" rx="0.75" fill="currentColor"/>
</svg>
