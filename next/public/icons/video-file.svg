<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<!-- Film strip frame -->
	<rect x="3" y="5" width="18" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
	<!-- Left sprocket holes -->
	<rect x="5"  y="7"  width="2" height="2" rx="0.4" fill="currentColor"/>
	<rect x="5"  y="11" width="2" height="2" rx="0.4" fill="currentColor"/>
	<rect x="5"  y="15" width="2" height="2" rx="0.4" fill="currentColor"/>
	<!-- Right sprocket holes -->
	<rect x="17" y="7"  width="2" height="2" rx="0.4" fill="currentColor"/>
	<rect x="17" y="11" width="2" height="2" rx="0.4" fill="currentColor"/>
	<rect x="17" y="15" width="2" height="2" rx="0.4" fill="currentColor"/>
	<!-- Play triangle -->
	<polygon points="10,9.5 10,14.5 15,12" fill="currentColor"/>
</svg>
